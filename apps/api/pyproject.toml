[project]
name = "audit-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "audit-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audit_api"]

[tool.uv.sources]
audit-engine = { workspace = true }
