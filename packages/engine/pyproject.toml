[project]
name = "audit-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.14",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audit_engine"]
